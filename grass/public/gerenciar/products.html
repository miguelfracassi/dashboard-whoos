<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerenciar Produtos</title><link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"></head>
<body><div class="frame"><div id="nav"></div><main class="panel"><div class="hd g mint deco x1"><div><h1>Gerenciar Produtos</h1><p class="mut">Crie categorias e organize seus produtos dentro delas.</p></div><img src="../img/analista.svg" alt=""></div>
<form class="g row" id="cf"><input name="name" placeholder="Nome da nova categoria" required><button class="btn">Criar categoria</button></form>
<form class="g row" id="f"><input name="name" placeholder="Nome" required><input name="price" type="number" step="0.01" min="0" placeholder="Preço (R$)" required><select name="categoryId" id="cs" aria-label="Categoria"></select><input name="stock" id="stk" type="number" min="0" placeholder="Estoque"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="unl" style="width:18px;height:18px;padding:0"> Estoque infinito ∞</label><input name="description" placeholder="Descrição"><button class="btn">Criar produto</button></form>
<div id="l"></div></main></div><script src="../js/app.js"></script><script>
shell('/gerenciar/products');
let C=[],P=[];
const stk=$('#stk'),unl=$('#unl');
unl.onchange=()=>{stk.disabled=unl.checked;if(unl.checked)stk.value=''};
const opts=(sel='')=>'<option value="">Sem categoria</option>'+C.map(c=>`<option value="${c.id}"${c.id===sel?' selected':''}>${esc(c.name)}</option>`).join('');
const row=p=>`<div class="item"><i class="ib">${ico('box')}</i><div style="flex:1"><b>${esc(p.name)}</b><div class="mut">${esc(p.description)} · ${p.unlimited?'estoque ∞':'estoque '+p.stock}</div></div><div class="acts"><span class="tag">${brl(p.price)}</span><select style="width:auto;padding:7px 14px;font-size:14px" onchange="mv('${p.id}',this.value)" aria-label="Categoria">${opts(p.categoryId)}</select><button class="btn s glass gl" onclick="ed('${p.id}',${p.price})">Editar preço</button><button class="btn s glass gl" onclick="tg('${p.id}',${!p.unlimited})">${p.unlimited?'Limitar estoque':'∞ Infinito'}</button><button class="btn s red" onclick="del('${p.id}')">Excluir</button></div></div>`;
const grp=({c,l})=>`<div class="g" style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px"><h2 style="margin:0">${c?esc(c.name):'Sem categoria'} <span class="tag">${l.length}</span></h2>${c?`<div class="acts"><button class="btn s glass gl" data-n="${esc(c.name)}" onclick="rc('${c.id}',this.dataset.n)">Renomear</button><button class="btn s red" onclick="dc('${c.id}')">Excluir categoria</button></div>`:''}</div>${l.length?l.map(row).join(''):'<div class="empty">Nenhum produto nesta categoria.</div>'}</div>`;
async function load(){[C,P]=await Promise.all([api('/categories'),api('/products')]);
 const cur=$('#cs').value;$('#cs').innerHTML=opts(cur);
 const G=[...C.map(c=>({c,l:P.filter(p=>p.categoryId===c.id)})),{c:null,l:P.filter(p=>!C.some(c=>c.id===p.categoryId))}].filter(g=>g.c||g.l.length);
 $('#l').innerHTML=G.length?G.map(grp).join(''):'<div class="g"><div class="empty"><img src="'+ROOT+'img/mascot.svg" alt="">Nenhum produto. Crie uma categoria e o primeiro produto acima.</div></div>'}
$('#cf').onsubmit=async e=>{e.preventDefault();try{await api('/categories',{method:'POST',body:Object.fromEntries(new FormData(e.target))});e.target.reset();toast('Categoria criada');load()}catch(x){toast(x.message)}};
$('#f').onsubmit=async e=>{e.preventDefault();try{const b=Object.fromEntries(new FormData(e.target));b.unlimited=unl.checked;await api('/products',{method:'POST',body:b});e.target.reset();stk.disabled=false;toast('Produto criado');load()}catch(x){toast(x.message)}};
async function rc(id,old){const n=prompt('Novo nome da categoria:',old);if(n!==null){try{await api('/categories/'+id,{method:'PUT',body:{name:n}});toast('Categoria renomeada');load()}catch(x){toast(x.message)}}}
async function dc(id){if(confirm('Excluir esta categoria? Os produtos dela ficam sem categoria.')){await api('/categories/'+id,{method:'DELETE'});toast('Categoria excluída');load()}}
async function mv(id,cat){try{await api('/products/'+id,{method:'PUT',body:{categoryId:cat}});toast('Produto movido');load()}catch(x){toast(x.message)}}
async function tg(id,inf){const p=P.find(x=>x.id===id);let b={unlimited:inf};
 if(!inf){const n=prompt('Quantidade em estoque:',p.stock);if(n===null)return;b.stock=n}
 await api('/products/'+id,{method:'PUT',body:b});toast(inf?'Estoque infinito ativado':'Estoque limitado');load()}
async function del(id){if(confirm('Excluir este produto?')){await api('/products/'+id,{method:'DELETE'});toast('Produto excluído');load()}}
async function ed(id,v){const n=prompt('Novo preço (R$):',v);if(n!==null){await api('/products/'+id,{method:'PUT',body:{price:n}});toast('Preço atualizado');load()}}
window.refresh=load;load();</script></body></html>
