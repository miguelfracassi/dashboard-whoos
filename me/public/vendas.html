<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendas</title>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body><div class="frame"><div id="nav"></div><main class="panel"><div class="hd g peach deco x2"><div><h1>Vendas</h1><p class="mut">Tudo que foi vendido e o valor total.</p></div><img src="img/mascot.svg" alt=""></div>
<div class="stats"><div class="g mint stat deco x1"><b id="t">R$ 0</b><span>Valor total vendido</span></div><div class="g peach stat deco x2"><b id="n">0</b><span>Vendas registradas</span></div></div>
<form class="g row" id="f"><select name="productId" id="s" required></select><input name="quantity" type="number" min="1" value="1"><input name="coupon" placeholder="Cupom (opcional)" style="text-transform:uppercase"><button class="btn">Registrar venda</button></form>
<div class="g"><h2>Histórico</h2><div id="l"></div></div></main></div><script src="js/app.js"></script><script>
shell('/vendas');
async function load(){const[sm,pr,sl]=await Promise.all([api('/summary'),api('/products'),api('/sales')]);t.textContent=brl(sm.totalSold);n.textContent=sm.salesCount;
 s.innerHTML=pr.length?pr.map(p=>`<option value="${p.id}">${esc(p.name)} — ${brl(p.price)}</option>`).join(''):'<option value="">Crie um produto antes</option>';
 l.innerHTML=sl.length?sl.slice().reverse().map(x=>`<div class="item"><i class="ib">${ico('coin')}</i><span style="flex:1"><b>${esc(x.productName)}</b> × ${x.quantity}${x.coupon?` <span class="mut">· cupom ${esc(x.coupon)} (−${brl(x.discount)})</span>`:''}</span><span class="tag">${brl(x.total)}</span></div>`).join(''):'<div class="empty"><img src="'+ROOT+'img/mascot.svg" alt="">Nenhuma venda registrada.</div>'}
f.onsubmit=async e=>{e.preventDefault();try{await api('/sales',{method:'POST',body:Object.fromEntries(new FormData(f))});toast('Venda registrada');load()}catch(x){toast(x.message)}};
window.refresh=load;load();</script></body></html>
