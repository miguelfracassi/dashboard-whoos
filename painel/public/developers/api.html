shell('');api('/key').then(d=>{const U=location.origin+'/api';
ex.textContent=`import requests

API = "${U}"
KEY = "${d.key}"
H = {"x-api-key": KEY}

def call(method, path, **kw):
    r = requests.request(method, API + path, headers=H, timeout=15, **kw)
    return r.json()

call("POST", "/products", json={"name": "VIP", "price": 19.9, "stock": 10})
call("PATCH", f"/tickets/{ticket_id}", json={"status": "realizado"})
print(call("GET", "/summary")["totalSold"])
print(call("POST", "/ai", json={"messages": [{"role": "user", "content": "Quanto vendi?"}]})["reply"])`;
dc.textContent=`import aiohttp, discord
from discord.ext import commands

API = "${U}"
KEY = "${d.key}"

async def api(method, path, **kw):
    async with aiohttp.ClientSession(headers={"x-api-key": KEY}) as s:
        async with s.request(method, API + path, **kw) as r:
            return await r.json()

bot = commands.Bot(command_prefix="!", intents=discord.Intents.all())

@bot.command()
async def total(ctx):
    d = await api("GET", "/summary")
    await ctx.send(f"Total vendido: R$ {d['totalSold']:.2f}")

@bot.command()
async def ia(ctx, *, texto):
    d = await api("POST", "/ai", json={"messages": [{"role": "user", "content": texto}]})
    await ctx.send(d["reply"])`}).catch(e=>k.textContent=e.message);
