<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerenciar Produtos</title><link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"></head>
<body><div class="frame"><div id="nav"></div><main class="panel"><div class="hd g mint deco x1"><div><h1>Gerenciar Produtos</h1><p class="mut">Crie, edite e exclua os produtos do painel.</p></div><img src="../img/analista.svg" alt=""></div>
<form class="g row" id="f"><input name="name" placeholder="Nome" required><input name="price" type="number" step="0.01" min="0" placeholder="Preço (R$)" required><input name="stock" type="number" min="0" placeholder="Estoque"><input name="description" placeholder="Descrição"><button class="btn">Criar produto</button></form>
<div class="g"><div id="l"></div></div></main></div><script src="../js/app.js"></script><script>
shell('/gerenciar/products');
async function load(){const l=await api('/products');$('#l').innerHTML=l.length?l.map(p=>`<div class="item"><i class="ib">${ico('box')}</i><div style="flex:1"><b>${esc(p.name)}</b><div class="mut">${esc(p.description)} · estoque ${p.stock}</div></div><div class="acts"><span class="tag">${brl(p.price)}</span><button class="btn s glass gl" onclick="ed('${p.id}',${p.price})">Editar preço</button><button class="btn s red" onclick="del('${p.id}')">Excluir</button></div></div>`).join(''):'<div class="empty"><img src="'+ROOT+'img/mascot.svg" alt="">Nenhum produto. Crie o primeiro acima.</div>'}
$('#f').onsubmit=async e=>{e.preventDefault();try{await api('/products',{method:'POST',body:Object.fromEntries(new FormData(e.target))});e.target.reset();toast('Produto criado');load()}catch(x){toast(x.message)}};
async function del(id){if(confirm('Excluir este produto?')){await api('/products/'+id,{method:'DELETE'});toast('Produto excluído');load()}}
async function ed(id,v){const n=prompt('Novo preço (R$):',v);if(n!==null){await api('/products/'+id,{method:'PUT',body:{price:n}});toast('Preço atualizado');load()}}
window.refresh=load;load();</script></body></html>
